name: Windows Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"
  JAVAFX_VERSION: "21.0.10"

jobs:
  portable:
    name: Build Portable Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download JavaFX modules
        shell: pwsh
        run: |
          $version = "${{ env.JAVAFX_VERSION }}"
          $libDir = Join-Path $env:RUNNER_TEMP "javafx-lib"
          Remove-Item $libDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $libDir | Out-Null
          foreach ($module in @('base','graphics','controls','fxml')) {
            $artifact = "javafx-$module-$version-win.jar"
            $url = "https://repo1.maven.org/maven2/org/openjfx/javafx-$module/$version/$artifact"
            curl.exe -L --fail --retry 5 --retry-delay 2 --output (Join-Path $libDir $artifact) $url
          }
          "TV_JAVAFX_LIB=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable package
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trustvault-portable
          path: |
            dist/TrustVault-portable.zip
            dist/TrustVault/**

  release:
    name: Build Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download JavaFX modules
        shell: pwsh
        run: |
          $version = "${{ env.JAVAFX_VERSION }}"
          $libDir = Join-Path $env:RUNNER_TEMP "javafx-lib"
          Remove-Item $libDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $libDir | Out-Null
          foreach ($module in @('base','graphics','controls','fxml')) {
            $artifact = "javafx-$module-$version-win.jar"
            $url = "https://repo1.maven.org/maven2/org/openjfx/javafx-$module/$version/$artifact"
            curl.exe -L --fail --retry 5 --retry-delay 2 --output (Join-Path $libDir $artifact) $url
          }
          "TV_JAVAFX_LIB=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build portable package
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -AppVersion "${{ steps.version.outputs.value }}"
          Copy-Item .\dist\TrustVault-portable.zip $env:RUNNER_TEMP\TrustVault-portable.zip -Force

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}\TrustVault-portable.zip
