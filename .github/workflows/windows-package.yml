name: Windows Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package_type:
        description: Windows output to generate
        required: true
        default: exe
        type: choice
        options:
          - exe
          - msi
          - app-image

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  package:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolve packaging metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$pom = Get-Content pom.xml
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            $pom.project.version
          }

          $packageType = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.package_type }}"
          } else {
            "exe"
          }

          if ([string]::IsNullOrWhiteSpace($packageType)) {
            $packageType = "exe"
          }

          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_type=$packageType" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install WiX Toolset
        if: steps.meta.outputs.package_type != 'app-image'
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wixDirectory = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory |
            Where-Object { $_.Name -like "WiX Toolset*" } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixDirectory) {
            throw "WiX Toolset installation directory was not found."
          }
          (Join-Path $wixDirectory.FullName "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build fat JAR and package app
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -PackageType "${{ steps.meta.outputs.package_type }}" -AppVersion "${{ steps.meta.outputs.app_version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: trustvault-windows-${{ steps.meta.outputs.package_type }}
          if-no-files-found: warn
          path: |
            target/*-all.jar
            dist/app-image/**
            dist/installer/**
            dist/runtime/**

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*
